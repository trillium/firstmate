story = "Given the decision-hold-lifecycle skill and firstmate's OPEN DECISIONS startup display, when a status line records a keyed captain decision, then fm-classify-lib folds it by its stable decision key so the same unresolved decision is surfaced durably on every startup instead of being lost."
test  = "source bin/fm-classify-lib.sh && _fm_decision_key 'blocked[key=deploy-region]: pick'"
