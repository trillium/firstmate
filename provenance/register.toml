[[feature]]
id    = "herdr-backend"
story = "Given the experimental Herdr session-provider backend, when firstmate decides whether Herdr's presentation projection is available, then bin/backends/herdr.sh gates it behind a Herdr release floor via a deterministic version comparison, so an older Herdr never triggers the projection path."
test  = "source bin/backends/herdr.sh && fm_backend_herdr_version_at_least 0.8.1 0.8.0 && echo YES; fm_backend_herdr_version_at_least 0.7.1 0.8.0 || echo NO"
