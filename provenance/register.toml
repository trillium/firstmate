# provenance/register.toml - the fork-feature provenance register.
#
# One [[feature]] block per fork-only feature that must survive fast-moving
# upstream merges. This file lives in the fork-owned provenance/ namespace that
# upstream firstmate never writes, so a merge can never silently clobber it.
#
# Each feature carries:
#   id      - stable slug (also names tests/provenance/<id>/).
#   story   - the user-story / Given-When-Then spec, in human prose. Reviewed in
#             PRs like any doc; this is the honest-keeping anchor.
#   test    - a command whose scrubbed combined output + exit code is diffed
#             against the approved golden master at tests/provenance/<id>/approved.txt.
#             THIS is the load-bearing guarantee ("the feature still works as approved").
#   [[feature.anchor]] - one or more locators + deletion tripwires:
#             path   - file the feature lives in. A vanished path is a FAIL.
#             symbol - optional bash function name; a vanished symbol is a FAIL.
#                      Omit to anchor the whole file (existence tripwire only).
#             sig    - normalized fingerprint of the anchored region. A drift is a
#                      WARN, not a FAIL: upstream edits legitimately shift code
#                      without deleting the feature. Re-bless with `check.sh --regen`.
#
# Adding a feature = one [[feature]] block here + one snapshot (via --regen).

version = 1

[[feature]]
id    = "launch-tracked-agent"
story = "As the captain, I want to launch an agent and have firstmate track it, so fork work runs in an isolated worktree with a recorded launch contract."
test  = "bin/fm-spawn.sh --help"
[[feature.anchor]]
path   = "bin/fm-spawn.sh"
symbol = "usage"
sig    = "70eb6ba9abdc98a9"
[[feature.anchor]]
path   = "bin/fm-spawn.sh"
symbol = "launch_template"
sig    = "13fc0c1c3bc75e38"

[[feature]]
id    = "decision-hold"
story = "As the captain, I want firstmate to record durable decision holds so an unresolved decision survives across sessions instead of being lost."
test  = "bin/fm-decision-hold.sh --help"
[[feature.anchor]]
path   = "bin/fm-decision-hold.sh"
symbol = "hold_id"
sig    = "2ec7fbd85debc2f1"
[[feature.anchor]]
path   = "bin/fm-decision-hold.sh"
symbol = "validate_slug"
sig    = "ba2c327a60dca27e"

[[feature]]
id    = "claude-multi-account"
story = "As the captain, I want to launch Claude Code crewmates under isolated per-account credentials so accounts never leak OAuth tokens across each other."
test  = "bin/claude-account.sh not-an-index"
[[feature.anchor]]
path   = "bin/claude-account.sh"
sig    = "cf3c9bbe5cdc7735"

[[feature]]
id    = "remote-ssh-transport"
story = "Given a reachable remote mini host, when the captain dispatches a crewmate to it, then firstmate allocates the remote worktree and drives launch, reclaim, reconcile, and status over the SSH bridge rather than running the work locally."
test  = "bin/fm-remote-launch.sh --help"
[[feature.anchor]]
path   = "bin/fm-remote-launch.sh"
symbol = "usage"
sig    = "76e7531d766651dd"
[[feature.anchor]]
path   = "bin/fm-remote-launch.sh"
symbol = "fm_remote_bridge_command"
sig    = "1da6e1926171af7c"
[[feature.anchor]]
path   = "docs/remote-secondmates.md"
sig    = "7294f8f66a9329db"

[[feature]]
id    = "tasks-toml-beads-backend"
story = "Given a firstmate home with a .tasks.toml backlog config, when firstmate resolves which task-store backend to use, then it reads the configured value (markdown, tasks-axi, or the beads federated store) instead of assuming one, so the backlog can move to beads without touching code."
test  = "source bin/fm-tasks-axi-lib.sh && fm_backlog_backend_value"
[[feature.anchor]]
path   = ".tasks.toml"
sig    = "31c645e8fdeca7b7"
[[feature.anchor]]
path   = "bin/fm-tasks-axi-lib.sh"
symbol = "fm_backlog_backend_value"
sig    = "1ac247af6004aa26"
[[feature.anchor]]
path   = "bin/fm-tasks-axi-lib.sh"
symbol = "fm_beads_backend_available"
sig    = "22eb5049eab2e22b"

[[feature]]
id    = "fork-local-skills"
story = "Given fork-local skills under .agents/skills, when a Claude or IDE harness looks for skills at .claude/skills, then the symlink resolves to .agents/skills and fork-only skills such as firstmate-orca are discoverable without colliding with upstream."
test  = "readlink .claude/skills && test -f .agents/skills/firstmate-orca/SKILL.md && echo firstmate-orca:present"
[[feature.anchor]]
path   = ".agents/skills/firstmate-orca/SKILL.md"
sig    = "c51ad0ccb1848c2a"

[[feature]]
