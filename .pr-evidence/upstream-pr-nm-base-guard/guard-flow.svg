<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <rect width="1200" height="360" fill="#0d1117"/>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#f0f6fc}.h{font-size:30px;font-weight:700}.b{font-size:20px}.s{font-size:17px;fill:#8b949e}.box{fill:#161b22;stroke:#58a6ff;stroke-width:3}.warn{fill:#3d1d1d;stroke:#f85149;stroke-width:3}.ok{fill:#132a1d;stroke:#3fb950;stroke-width:3}</style>
  <text x="48" y="55" class="h">No-mistakes upstream PR base guard</text>
  <text x="48" y="85" class="s">Structured task PR link is checked before a worker or task record is created.</text>
  <rect x="48" y="130" width="300" height="140" rx="16" class="box"/>
  <text x="76" y="180" class="b">Linked PR target</text><text x="76" y="212" class="s">github.com/upstream/repo</text>
  <rect x="450" y="130" width="300" height="140" rx="16" class="box"/>
  <text x="478" y="180" class="b">Clone origin</text><text x="478" y="212" class="s">github.com/fork/repo</text>
  <path d="M350 200H438" stroke="#8b949e" stroke-width="4"/><path d="M438 200l-15-10v20z" fill="#8b949e"/>
  <rect x="852" y="130" width="300" height="140" rx="16" class="warn"/>
  <text x="880" y="180" class="b">Mismatch</text><text x="880" y="212" class="s">Refuse no-mistakes</text><text x="880" y="240" class="s">Use direct-PR upstream base</text>
  <path d="M752 200H840" stroke="#f85149" stroke-width="4"/><path d="M840 200l-15-10v20z" fill="#f85149"/>
  <text x="48" y="325" class="s">Same-repository PRs and direct-PR tasks continue through the normal spawn path.</text>
</svg>
