<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f172a"/>
  <text x="600" y="62" fill="#f8fafc" font-family="Arial, sans-serif" font-size="31" font-weight="700" text-anchor="middle">fm-reap legacy record behavior</text>
  <text x="300" y="115" fill="#fca5a5" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Before</text>
  <text x="900" y="115" fill="#86efac" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">After</text>
  <g font-family="Arial, sans-serif" font-size="21" text-anchor="middle">
    <rect x="80" y="155" width="440" height="125" rx="16" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <text x="300" y="205" fill="#f8fafc">Legacy task record</text>
    <text x="300" y="240" fill="#cbd5e1">missing spawn_gen</text>
    <path d="M300 280 L300 355" stroke="#f87171" stroke-width="5" marker-end="url(#redArrow)"/>
    <rect x="80" y="380" width="440" height="150" rx="16" fill="#7f1d1d" stroke="#f87171" stroke-width="2"/>
    <text x="300" y="435" fill="#fee2e2">Automatic reap refused</text>
    <text x="300" y="472" fill="#fecaca">or captain hold refused</text>
    <text x="300" y="505" fill="#fecaca">when the backlog row had no title</text>
    <rect x="680" y="155" width="440" height="125" rx="16" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <text x="900" y="205" fill="#f8fafc">Legacy task record</text>
    <text x="900" y="240" fill="#cbd5e1">missing spawn_gen</text>
    <path d="M900 280 L900 355" stroke="#4ade80" stroke-width="5" marker-end="url(#greenArrow)"/>
    <rect x="680" y="380" width="440" height="150" rx="16" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
    <text x="900" y="425" fill="#dcfce7">fm-teardown --legacy-record</text>
    <text x="900" y="460" fill="#bbf7d0">still verifies dead endpoint</text>
    <text x="900" y="495" fill="#bbf7d0">and refuses unlanded work</text>
  </g>
  <text x="600" y="590" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="19" text-anchor="middle">A missing hold title is retried as “Task &lt;task-id&gt;”; existing backlog titles remain untouched.</text>
  <defs>
    <marker id="redArrow" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f87171"/></marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4ade80"/></marker>
  </defs>
</svg>
